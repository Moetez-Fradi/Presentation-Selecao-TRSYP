; Dosing station firmware. Build/flash with the PlatformIO extension or `pio run -t upload`.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
build_flags = -I src
lib_deps =
    bogde/HX711@^0.7.5
    bblanchon/ArduinoJson@^7.2.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; upload_port = COM3   ; uncomment and set if auto-detect picks the wrong port

; Same build, uploads without auto-reset: hold BOOT, tap EN, release BOOT, then upload. Press EN after.
[env:esp32dev_manual]
extends = env:esp32dev
board_upload.before_reset = no_reset
