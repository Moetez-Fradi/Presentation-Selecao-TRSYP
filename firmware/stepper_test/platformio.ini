; Standalone stepper test. Does not touch the station firmware.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes

; Upload without auto-reset: hold BOOT, tap EN, release BOOT, then upload. Press EN after.
[env:esp32dev_manual]
extends = env:esp32dev
board_upload.before_reset = no_reset
