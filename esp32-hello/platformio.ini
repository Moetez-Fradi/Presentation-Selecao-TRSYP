; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_deps =
    bogde/HX711@^0.7.5
; upload_port = COM3   ; uncomment and set if auto-detect picks the wrong port

; Same build, but uploads without auto-reset. Before uploading, put the board
; in download mode by hand: hold BOOT, tap EN, release BOOT. Press EN after.
[env:esp32dev_manual]
extends = env:esp32dev
board_upload.before_reset = no_reset
